<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" width="780" height="230" font-family="Segoe UI"><defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a3acbd"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2dd4bf"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker></defs><rect x="8" y="70" width="118" height="70" rx="9" fill="#1c2230" stroke="#fb923c" stroke-width="1.6"/><text x="67" y="91" text-anchor="middle" style="fill:#fb923c;font-size:13px;font-weight:600">Reference</text><text x="67" y="108" text-anchor="middle" style="fill:#a3acbd;font-size:10.8px">path p_r(s) or</text><text x="67" y="122" text-anchor="middle" style="fill:#a3acbd;font-size:10.8px">trajectory q_r(t)</text><text x="67" y="136" text-anchor="middle" style="fill:#a3acbd;font-size:10.8px">from the planner</text><rect x="176" y="10" width="196" height="74" rx="9" fill="#1c2230" stroke="#60a5fa" stroke-width="1.6"/><text x="274" y="31" text-anchor="middle" style="fill:#60a5fa;font-size:13px;font-weight:600">Lateral control</text><text x="274" y="48" text-anchor="middle" style="fill:#a3acbd;font-size:10.8px">Pure Pursuit · Stanley</text><text x="274" y="62" text-anchor="middle" style="fill:#a3acbd;font-size:10.8px">(path) · Kanayama</text><text x="274" y="76" text-anchor="middle" style="fill:#a3acbd;font-size:10.8px">(trajectory)</text><rect x="176" y="126" width="196" height="74" rx="9" fill="#1c2230" stroke="#2dd4bf" stroke-width="1.6"/><text x="274" y="147" text-anchor="middle" style="fill:#2dd4bf;font-size:13px;font-weight:600">Longitudinal control</text><text x="274" y="164" text-anchor="middle" style="fill:#a3acbd;font-size:10.8px">PI on speed → a_des, limits,</text><text x="274" y="178" text-anchor="middle" style="fill:#a3acbd;font-size:10.8px">actuator map / adaptive</text><text x="274" y="192" text-anchor="middle" style="fill:#a3acbd;font-size:10.8px">inverse model → u</text><rect x="430" y="66" width="118" height="78" rx="9" fill="#1c2230" stroke="#dfe4ec" stroke-width="1.6"/><text x="489" y="87" text-anchor="middle" style="fill:#dfe4ec;font-size:13px;font-weight:600">Vehicle</text><text x="489" y="104" text-anchor="middle" style="fill:#a3acbd;font-size:10.8px">bicycle model</text><text x="489" y="118" text-anchor="middle" style="fill:#a3acbd;font-size:10.8px">m v̇ = F − F_res</text><rect x="604" y="66" width="168" height="78" rx="9" fill="#1c2230" stroke="#a78bfa" stroke-width="1.6"/><text x="688" y="87" text-anchor="middle" style="fill:#a78bfa;font-size:13px;font-weight:600">State estimation</text><text x="688" y="104" text-anchor="middle" style="fill:#a3acbd;font-size:10.8px">(x, y, ψ, v) for</text><text x="688" y="118" text-anchor="middle" style="fill:#a3acbd;font-size:10.8px">the errors e_y, e_ψ,</text><text x="688" y="132" text-anchor="middle" style="fill:#a3acbd;font-size:10.8px">e_v, e_x …</text><path d="M126 96 L150 96 L150 47 L174 47" fill="none" stroke="#fb923c" stroke-width="1.7" marker-end="url(#ao)"/><path d="M150 112 L150 163 L174 163" fill="none" stroke="#fb923c" stroke-width="1.7" marker-end="url(#ao)"/><path d="M372 47 L400 47 L400 92 L428 92" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#ab)"/><path d="M372 163 L400 163 L400 118 L428 118" fill="none" stroke="#2dd4bf" stroke-width="1.7" marker-end="url(#at)"/><text x="386" y="38" text-anchor="middle" style="fill:#60a5fa;font-size:11px;font-weight:600">steering δ</text><text x="386" y="184" text-anchor="middle" style="fill:#2dd4bf;font-size:11px;font-weight:600">throttle / brake u</text><path d="M548 105 L602 105" fill="none" stroke="#a3acbd" stroke-width="1.7" marker-end="url(#am)"/><path d="M688 144 L688 220 L274 220 L274 202" fill="none" stroke="#4ade80" stroke-width="1.7" marker-end="url(#ag)"/><path d="M688 66 L688 4 L274 4 L274 8" fill="none" stroke="#4ade80" stroke-width="1.7" marker-end="url(#ag)"/><text x="480" y="214" text-anchor="middle" style="fill:#4ade80;font-size:11px;font-weight:600">errors relative to the reference, recomputed every control cycle</text></svg>