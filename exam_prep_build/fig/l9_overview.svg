ize:11px">costs J</text><rect x="412" y="44" width="124" height="80" rx="9" fill="#1c2230" stroke="#4ade80" stroke-width="1.6"/><text x="474" y="66" text-anchor="middle" style="fill:#4ade80;font-size:13.5px;font-weight:600">Select</text><text x="474" y="84" text-anchor="middle" style="fill:#a3acbd;font-size:11px">best valid τ*</text><text x="474" y="98" text-anchor="middle" style="fill:#a3acbd;font-size:11px">by preference π</text><text x="474" y="112" text-anchor="middle" style="fill:#a3acbd;font-size:11px">argmin J</text><path d="M256 84 L270 84" fill="none" stroke="#a3acbd" stroke-width="1.7" marker-end="url(#am)"/><path d="M396 84 L410 84" fill="none" stroke="#a3acbd" stroke-width="1.7" marker-end="url(#am)"/><rect x="8" y="44" width="96" height="80" rx="9" fill="#1c2230" stroke="#fb923c" stroke-width="1.6"/><text x="56" y="66" text-anchor="middle" style="fill:#fb923c;font-size:13.5px;font-weight:600">Situation</text><text x="56" y="84" text-anchor="middle" style="fill:#a3acbd;font-size:11px">c: ego, objects,</text><text x="56" y="98" text-anchor="middle" style="fill:#a3acbd;font-size:11px">road; goal g</text><path d="M104 84 L130 84" fill="none" stroke="#fb923c" stroke-width="1.7" marker-end="url(#ao)"/><rect x="580" y="44" width="90" height="80" rx="9" fill="#1c2230" stroke="#fb7185" stroke-width="1.6"/><text x="625" y="66" text-anchor="middle" style="fill:#fb7185;font-size:13.5px;font-weight:600">Controller</text><text x="625" y="84" text-anchor="middle" style="fill:#a3acbd;font-size:11px">tracks τ*</text><text x="625" y="98" text-anchor="middle" style="fill:#a3acbd;font-size:11px">(next lecture)</text><rect x="686" y="44" width="86" height="80" rx="9" fill="#1c2230" stroke="#dfe4ec" stroke-width="1.6"/><text x="729" y="66" text-anchor="middle" style="fill:#dfe4ec;font-size:13.5px;font-weight:600">Vehicle</text><text x="729" y="84" text-anchor="middle" style="fill:#a3acbd;font-size:11px">executes</text><text x="729" y="98" text-anchor="middle" style="fill:#a3acbd;font-size:11px">only Δt</text><path d="M536 84 L578 84" fill="none" stroke="#2dd4bf" stroke-width="1.7" marker-end="url(#at)"/><text x="557" y="76" text-anchor="middle" style="fill:#2dd4bf;font-size:12px;font-weight:600;font-style:italic;">τ*</text><path d="M670 84 L684 84" fill="none" stroke="#a3acbd" stroke-width="1.7" marker-end="url(#am)"/><rect x="560" y="170" width="212" height="56" rx="9" fill="#1c2230" stroke="#a78bfa" stroke-width="1.6"/><text x="666" y="192" text-anchor="middle" style="fill:#a78bfa;font-size:13.5px;font-weight:600">Observation · state estimation</text><text x="666" y="210" text-anchor="middle" style="fill:#a3acbd;font-size:11px">new c after Δt</text><path d="M729 124 L729 168" fill="none" stroke="#a3acbd" stroke-width="1.7" marker-end="url(#am)"/><path d="M560 198 L56 198 L56 126" fill="none" stroke="#4ade80" stroke-width="1.7" marker-end="url(#ag)"/><text x="300" y="216" text-anchor="middle" style="fill:#4ade80;font-size:11.5px;font-weight:600;">repeat every Δt: receding horizon — plan T seconds ahead, execute only the first Δt</text></svg>